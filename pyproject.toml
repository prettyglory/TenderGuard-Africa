[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderguard-africa"
version = "0.1.0"
description = "Agentic AI procurement assistant for auditable public tender evaluation in Africa."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

dependencies = [
    "mcp[cli]>=2.0,<3.0",
    "langgraph>=1.2,<2.0",
    "pydantic>=2.12,<3.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.1,<2.0",
    "pypdf>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.2,<2.0",
    "ruff>=0.13,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100